name: Metrics
on:
  # 每天自动运行一次更新数据（你可以改成任何你想要的频率）
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # 基础配置与看板排版
          template: classic
          base: header, activity, community, repositories, metadata
          
          # 核心高科技插件
          plugin_languages: yes
          plugin_languages_ignored: html, css # 忽略的语言
          plugin_languages_details: bytes, percentage
          plugin_habits: yes
          plugin_lines: yes