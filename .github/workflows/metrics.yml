name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 检出仓库代码，让后面的插件能把文件存到仓库里
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 运行 metrics 生成插件
      - name: Full-stack metrics generator
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes, percentage
          plugin_habits: yes
          plugin_lines: yes
          filename: metrics.svg

      # 3. 自动将生成的 metrics.svg 提交并推送到 main 分支
      - name: Commit and push metrics.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update github metrics svg"
          file_pattern: metrics.svg